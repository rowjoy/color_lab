<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Original Color Lab study-room scene. Editable fills live only inside
       their four named groups; highlights and shadows add material depth. -->
  <defs>
    <linearGradient id="study-window-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FD7EA"/>
      <stop offset="1" stop-color="#DCEFF1"/>
    </linearGradient>
    <linearGradient id="study-rug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#526D77"/>
      <stop offset="1" stop-color="#2F4652"/>
    </linearGradient>
    <linearGradient id="study-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#294554"/>
      <stop offset="1" stop-color="#0D171D"/>
    </linearGradient>
    <linearGradient id="study-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#27343A"/>
      <stop offset=".5" stop-color="#637178"/>
      <stop offset="1" stop-color="#222D32"/>
    </linearGradient>
  </defs>

  <g id="study-room-shell">
    <g id="surface-ceiling">
      <path d="M0 0H1200V108L1120 140H80L0 108Z" fill="#00E5FF"/>
    </g>
    <path d="M46 83H1154L1120 124H80Z" fill="#FFFFFF" fill-opacity=".18"/>
    <path d="M80 124H1120" stroke="#FFFFFF" stroke-opacity=".68" stroke-width="13"/>
    <path d="M83 138H1117" stroke="#2B3940" stroke-opacity=".22" stroke-width="4"/>

    <g id="surface-wall">
      <path d="M0 108L80 140H1120L1200 108V552H0Z" fill="#FF00A1"/>
    </g>
    <path d="M0 108L80 140V552H0Z" fill="#000000" fill-opacity=".12"/>
    <path d="M1200 108L1120 140V552H1200Z" fill="#000000" fill-opacity=".075"/>
    <path d="M80 140H1120V552" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="3"/>

    <g id="surface-floor">
      <path d="M0 552H1200V800H0Z" fill="#B7FF00"/>
    </g>
    <path d="M0 542H1200V566H0Z" fill="#F7F3EA"/>
    <path d="M0 565H1200" stroke="#2B2725" stroke-opacity=".30" stroke-width="5"/>
    <g fill="none" stroke="#4A403A" stroke-opacity=".18" stroke-width="2">
      <path d="M600 552L62 800"/>
      <path d="M600 552L292 800"/>
      <path d="M600 552L474 800"/>
      <path d="M600 552L726 800"/>
      <path d="M600 552L908 800"/>
      <path d="M600 552L1138 800"/>
      <path d="M0 616C330 607 870 607 1200 616"/>
      <path d="M0 681C330 665 870 665 1200 681"/>
      <path d="M0 751C330 728 870 728 1200 751"/>
    </g>
  </g>

  <!-- Cool daylight is restrained and remains clear of exact test anchors. -->
  <path d="M88 166H354L520 552H252Z" fill="#D9EEF4" fill-opacity=".15"/>
  <path d="M118 448L410 552L324 800H40Z" fill="#CDE7EE" fill-opacity=".08"/>

  <g id="study-window">
    <path d="M64 148H374V474H64Z" fill="#1E2C33" fill-opacity=".28"/>
    <path d="M74 154H364V464H74Z" fill="#F4F1EA"/>
    <path d="M91 171H347V447H91Z" fill="#C7D0D2"/>
    <path d="M99 179H339V439H99Z" fill="#9FD7EA"/>
    <path d="M99 309H339V439H99Z" fill="#FFFFFF" fill-opacity=".24"/>
    <circle cx="292" cy="226" r="31" fill="#F7D783"/>
    <path d="M99 358L151 319L191 348L245 291L339 361V439H99Z" fill="#78978A"/>
    <path d="M99 385L158 348L205 380L263 329L339 383V439H99Z" fill="#456D60"/>
    <path d="M219 179V439M99 309H339" stroke="#F4F1EA" stroke-width="10"/>
    <path d="M86 166L99 179V439L86 452Z" fill="#FFFFFF" fill-opacity=".46"/>
    <path d="M352 166L339 179V439L352 452Z" fill="#000000" fill-opacity=".12"/>
    <path d="M42 143H394" stroke="#26343A" stroke-width="9" stroke-linecap="round"/>
    <path d="M42 143C76 190 74 258 62 320S47 417 82 487H22V143Z" fill="#526B75"/>
    <path d="M394 143C360 190 362 258 374 320S389 417 354 487H414V143Z" fill="#526B75"/>
    <path d="M45 157C65 218 54 292 45 353M391 157C371 218 382 292 391 353" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="8"/>
  </g>

  <g id="study-wall-art">
    <rect x="452" y="164" width="132" height="118" rx="5" fill="#1F282D"/>
    <rect x="463" y="175" width="110" height="96" fill="#F1EDE5"/>
    <path d="M476 251L505 206L530 234L558 194V258H476Z" fill="#637F70"/>
    <circle cx="518" cy="202" r="15" fill="#DDA06F"/>
    <rect x="694" y="164" width="132" height="118" rx="5" fill="#1F282D"/>
    <rect x="705" y="175" width="110" height="96" fill="#F1EDE5"/>
    <path d="M720 252L755 197L800 252Z" fill="#587A8A"/>
    <circle cx="781" cy="201" r="16" fill="#E4B85D"/>
    <path d="M452 282H584M694 282H826" stroke="#000000" stroke-opacity=".12" stroke-width="7"/>
  </g>

  <!-- Rug and contact shadows are deliberately below every furniture plane. -->
  <g id="study-rug-underlay">
    <path d="M276 646H923L1035 800H164Z" fill="#1B252B" fill-opacity=".16"/>
    <path d="M301 651H899L987 800H213Z" fill="url(#study-rug)"/>
    <path d="M330 682H881M304 721H909M276 762H940" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="4"/>
    <path d="M449 651L406 800M600 651V800M751 651L794 800" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="3"/>
    <ellipse cx="611" cy="724" rx="235" ry="48" fill="#182228" fill-opacity=".16"/>
    <ellipse cx="187" cy="733" rx="126" ry="27" fill="#182228" fill-opacity=".18"/>
  </g>

  <g id="surface-furniture">
    <!-- Built-in shelving picks up the same furniture material. -->
    <path d="M935 152H1135V519H935Z" fill="#7A00FF"/>
    <path d="M950 168H1120V503H950Z" fill="#000000" fill-opacity=".20"/>
    <path d="M950 270H1120V282H950ZM950 382H1120V394H950Z" fill="#7A00FF"/>
    <path d="M935 152H952V519H935Z" fill="#FFFFFF" fill-opacity=".15"/>
    <path d="M1118 152H1135V519H1118Z" fill="#000000" fill-opacity=".16"/>

    <!-- Desk top, front and legs use one editable base plus neutral planes. -->
    <rect x="326" y="520" width="590" height="34" rx="8" fill="#7A00FF"/>
    <path d="M338 520H904L886 530H350Z" fill="#FFFFFF" fill-opacity=".20"/>
    <path d="M326 546H916L902 556H340Z" fill="#000000" fill-opacity=".15"/>
    <rect x="448" y="554" width="342" height="78" rx="5" fill="#7A00FF"/>
    <path d="M448 554H790V568H448Z" fill="#FFFFFF" fill-opacity=".10"/>
    <path d="M448 618H790V632H448Z" fill="#000000" fill-opacity=".18"/>
    <rect x="360" y="552" width="43" height="184" rx="4" fill="#7A00FF"/>
    <path d="M360 552H374V736H360Z" fill="#FFFFFF" fill-opacity=".13"/>
    <path d="M391 552H403V736H391Z" fill="#000000" fill-opacity=".18"/>
    <rect x="841" y="552" width="43" height="184" rx="4" fill="#7A00FF"/>
    <path d="M841 552H855V736H841Z" fill="#FFFFFF" fill-opacity=".13"/>
    <path d="M872 552H884V736H872Z" fill="#000000" fill-opacity=".18"/>
    <rect x="468" y="572" width="112" height="44" rx="4" fill="#000000" fill-opacity=".16"/>
    <rect x="658" y="572" width="112" height="44" rx="4" fill="#000000" fill-opacity=".16"/>
    <path d="M479 587H569M669 587H759" stroke="#FFFFFF" stroke-opacity=".24" stroke-width="3"/>

    <!-- Ergonomic office chair. -->
    <path d="M518 628C518 595 544 578 578 583H649C683 578 707 596 707 629L695 698H530Z" fill="#7A00FF"/>
    <path d="M538 632C544 611 562 604 584 607H643C665 604 683 611 688 632L684 643H542Z" fill="#FFFFFF" fill-opacity=".14"/>
    <path d="M530 682H695L681 704H544Z" fill="#000000" fill-opacity=".17"/>
    <rect x="548" y="690" width="147" height="43" rx="20" fill="#7A00FF"/>
    <path d="M564 695H679L668 706H575Z" fill="#FFFFFF" fill-opacity=".12"/>

    <!-- Reading chair with shaped arms and believable material panels. -->
    <path d="M88 627C88 579 121 548 166 548H216C264 548 298 582 291 630L278 706H103Z" fill="#7A00FF"/>
    <path d="M119 611C128 578 153 566 183 568H216C247 569 268 587 270 618L263 644H116Z" fill="#FFFFFF" fill-opacity=".13"/>
    <path d="M103 682H278L270 706H111Z" fill="#000000" fill-opacity=".17"/>
    <path d="M101 623L79 647V696H108L123 630ZM278 623L300 647V696H271L257 630Z" fill="#7A00FF"/>
  </g>

  <!-- Neutral hardware and small decor render after the editable furniture. -->
  <g id="study-furniture-hardware">
    <circle cx="565" cy="594" r="4" fill="#D7C39A"/>
    <circle cx="754" cy="594" r="4" fill="#D7C39A"/>
    <path d="M622 729V758M622 749L556 778M622 749L688 778" stroke="url(#study-metal)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="548" cy="783" r="11" fill="#202A2F"/>
    <circle cx="696" cy="783" r="11" fill="#202A2F"/>
    <path d="M120 702L103 766M263 702L282 766" stroke="#513A30" stroke-width="13" stroke-linecap="round"/>
  </g>

  <g id="study-computer">
    <rect x="500" y="326" width="244" height="174" rx="14" fill="#273238"/>
    <rect x="514" y="340" width="216" height="144" rx="5" fill="url(#study-screen)"/>
    <path d="M532 460L580 408L618 438L674 378L714 460Z" fill="#4A8793" fill-opacity=".72"/>
    <circle cx="677" cy="384" r="17" fill="#EDC76C"/>
    <path d="M514 340H730L704 364H536Z" fill="#FFFFFF" fill-opacity=".07"/>
    <rect x="603" y="500" width="38" height="18" fill="#344047"/>
    <path d="M565 520H679" stroke="#344047" stroke-width="11" stroke-linecap="round"/>
    <rect x="700" y="532" width="118" height="12" rx="6" fill="#252F34"/>
    <ellipse cx="838" cy="538" rx="16" ry="10" fill="#252F34"/>
  </g>

  <g id="study-task-light">
    <ellipse cx="426" cy="518" rx="27" ry="7" fill="#1F292E" fill-opacity=".24"/>
    <circle cx="426" cy="510" r="19" fill="#34434A"/>
    <path d="M426 495V415L470 371" fill="none" stroke="#34434A" stroke-width="10" stroke-linecap="round"/>
    <path d="M454 354H514L491 398H433Z" fill="#D9A34D"/>
    <path d="M441 398H486" stroke="#F9E9B8" stroke-width="8" stroke-linecap="round"/>
    <path d="M439 402L370 520H534L486 402Z" fill="#FFD98B" fill-opacity=".075"/>
  </g>

  <g id="study-shelf-decor">
    <rect x="968" y="220" width="25" height="50" rx="2" fill="#C7795E"/>
    <rect x="998" y="210" width="22" height="60" rx="2" fill="#5D7B91"/>
    <rect x="1025" y="230" width="38" height="40" rx="2" fill="#D4AD59"/>
    <path d="M1080 266C1058 234 1071 204 1100 218C1112 188 1140 211 1121 267Z" fill="#56795C"/>
    <rect x="1081" y="258" width="43" height="20" rx="4" fill="#C78362"/>
    <rect x="972" y="350" width="22" height="32" fill="#627A9A"/>
    <rect x="999" y="338" width="25" height="44" fill="#CA7D5B"/>
    <rect x="1029" y="352" width="34" height="30" fill="#D0B15D"/>
    <circle cx="1091" cy="353" r="23" fill="#E8E1D3"/>
    <path d="M1091 353V337M1091 353L1102 361" stroke="#3A484E" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g id="study-plants-and-books">
    <rect x="783" y="500" width="92" height="16" rx="3" fill="#E6DED0"/>
    <rect x="775" y="483" width="98" height="17" rx="3" fill="#CC765B"/>
    <rect x="795" y="466" width="78" height="17" rx="3" fill="#587986"/>
    <path d="M102 542C74 510 83 474 111 487C120 457 155 468 146 500C177 492 187 528 157 546Z" fill="#4E7756"/>
    <path d="M127 543V482M127 518L101 501M128 510L151 493" stroke="#355441" stroke-width="5"/>
    <path d="M98 541H160L151 574H107Z" fill="#D7C8AF"/>
    <path d="M1040 548C1010 514 1020 476 1049 491C1059 459 1096 470 1086 505C1119 496 1131 534 1098 552Z" fill="#477153"/>
    <path d="M1065 550V486M1065 522L1038 505M1066 513L1090 495" stroke="#31513D" stroke-width="5"/>
    <path d="M1034 548H1104L1093 594H1045Z" fill="#D8CAB1"/>
  </g>

  <g id="study-ceiling-light">
    <path d="M735 0V56" stroke="#354148" stroke-width="5"/>
    <path d="M688 91L719 54H751L782 91Z" fill="#F4E8CF"/>
    <ellipse cx="735" cy="91" rx="49" ry="10" fill="#DDB560"/>
    <path d="M735 101V130" stroke="#F5D581" stroke-opacity=".23" stroke-width="78"/>
  </g>
</svg>
