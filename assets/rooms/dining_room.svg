<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Original Color Lab dining-room scene. -->
  <defs>
    <linearGradient id="dining-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BD6E7"/>
      <stop offset="1" stop-color="#E6F2EE"/>
