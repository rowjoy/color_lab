<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Original Color Lab kitchen scene. Cabinet planes are editable; fixed
       counters and appliances remain neutral for realistic comparison. -->
  <defs>
    <linearGradient id="kitchen-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BD7E7"/>
      <stop offset="1" stop-color="#E7F2ED"/>
    </linearGradient>
    <linearGradient id="kitchen-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AAB3B5"/>
      <stop offset=".5" stop-color="#EEF0EE"/>
      <stop offset="1" stop-color="#8F999C"/>
    </linearGradient>
  </defs>

  <g id="kitchen-shell">
    <g id="surface-ceiling">
      <path d="M0 0H1200V106L1118 140H82L0 106Z" fill="#00E5FF"/>
    </g>
    <path d="M48 82H1152L1118 124H82Z" fill="#FFFFFF" fill-opacity=".18"/>
    <path d="M82 124H1118" stroke="#FFFFFF" stroke-opacity=".70" stroke-width="13"/>
    <path d="M84 138H1116" stroke="#27363D" stroke-opacity=".20" stroke-width="4"/>

    <g id="surface-wall">
      <path d="M0 106L82 140H1118L1200 106V552H0Z" fill="#FF00A1"/>
    </g>
    <path d="M0 106L82 140V552H0Z" fill="#000000" fill-opacity=".11"/>
    <path d="M1200 106L1118 140V552H1200Z" fill="#000000" fill-opacity=".07"/>

    <g id="surface-floor">
      <path d="M0 552H1200V800H0Z" fill="#B7FF00"/>
    </g>
    <path d="M0 542H1200V565H0Z" fill="#F6F2EA"/>
    <path d="M0 565H1200" stroke="#312B27" stroke-opacity=".30" stroke-width="5"/>
    <g fill="none" stroke="#55483F" stroke-opacity=".17" stroke-width="2">
      <path d="M600 552L70 800M600 552L300 800M600 552L480 800M600 552L720 800M600 552L900 800M600 552L1130 800"/>
      <path d="M0 618C334 608 866 608 1200 618"/>
      <path d="M0 684C334 668 866 668 1200 684"/>
      <path d="M0 748C334 729 866 729 1200 748"/>
    </g>
  </g>

  <g id="kitchen-center-window">
    <rect x="458" y="270" width="284" height="211" fill="#223138" fill-opacity=".24"/>
    <rect x="469" y="279" width="262" height="193" fill="#F4F0E7"/>
    <rect x="484" y="294" width="232" height="163" fill="url(#kitchen-window)"/>
    <path d="M484 397L535 354L576 390L626 338L716 401V457H484Z" fill="#78998A"/>
    <path d="M600 294V457M484 374H716" stroke="#F4F0E7" stroke-width="9"/>
    <path d="M474 284L484 294V457L474 466Z" fill="#FFFFFF" fill-opacity=".40"/>
    <path d="M726 284L716 294V457L726 466Z" fill="#000000" fill-opacity=".10"/>
  </g>

  <path d="M470 286H730L858 552H350Z" fill="#DCEFF4" fill-opacity=".10"/>

  <g id="surface-furniture">
    <!-- Left upper and lower cabinetry. -->
    <rect x="70" y="172" width="338" height="216" rx="5" fill="#7A00FF"/>
    <path d="M70 172H89V388H70Z" fill="#FFFFFF" fill-opacity=".14"/>
    <path d="M389 172H408V388H389Z" fill="#000000" fill-opacity=".16"/>
    <path d="M183 172V388M296 172V388" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="3"/>
    <rect x="64" y="413" width="350" height="164" rx="5" fill="#7A00FF"/>
    <path d="M64 413H414V425H64Z" fill="#FFFFFF" fill-opacity=".12"/>
    <path d="M64 558H414V577H64Z" fill="#000000" fill-opacity=".17"/>
    <path d="M177 432V558M291 432V558" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="3"/>

    <!-- Right upper and lower cabinetry. -->
    <rect x="792" y="172" width="338" height="216" rx="5" fill="#7A00FF"/>
    <path d="M792 172H811V388H792Z" fill="#FFFFFF" fill-opacity=".14"/>
    <path d="M1111 172H1130V388H1111Z" fill="#000000" fill-opacity=".16"/>
    <path d="M905 172V388M1018 172V388" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="3"/>
    <rect x="786" y="413" width="350" height="164" rx="5" fill="#7A00FF"/>
    <path d="M786 413H1136V425H786Z" fill="#FFFFFF" fill-opacity=".12"/>
    <path d="M786 558H1136V577H786Z" fill="#000000" fill-opacity=".17"/>
    <path d="M899 432V558M1013 432V558" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="3"/>

    <!-- Central island cabinetry. -->
    <path d="M345 548H855L902 704H298Z" fill="#7A00FF"/>
    <path d="M356 548H844L860 570H340Z" fill="#FFFFFF" fill-opacity=".13"/>
    <path d="M298 684H902L892 704H308Z" fill="#000000" fill-opacity=".17"/>
    <path d="M450 570V684M750 570V684" stroke="#FFFFFF" stroke-opacity=".17" stroke-width="3"/>
    <path d="M325 700H365V764H333ZM835 700H875L867 764H835Z" fill="#7A00FF"/>
  </g>

  <!-- Neutral worktops, appliances and fittings stay fixed. -->
  <g id="kitchen-fixed-surfaces">
    <path d="M48 390H430L414 417H64Z" fill="#E7E3DA"/>
    <path d="M770 390H1152L1136 417H786Z" fill="#E7E3DA"/>
    <path d="M319 523H881L855 554H345Z" fill="#E8E4DC"/>
    <path d="M334 523H866L851 537H349Z" fill="#FFFFFF" fill-opacity=".56"/>
    <rect x="449" y="425" width="302" height="95" fill="#E7E2D8"/>
    <path d="M449 455H751M500 425V520M550 425V520M650 425V520M700 425V520" stroke="#B9B1A5" stroke-opacity=".55" stroke-width="2"/>
    <rect x="807" y="432" width="87" height="126" rx="4" fill="#273339"/>
    <rect x="820" y="445" width="61" height="67" rx="3" fill="#151D21"/>
    <circle cx="828" cy="532" r="5" fill="#C6CFD0"/>
    <circle cx="850" cy="532" r="5" fill="#C6CFD0"/>
    <circle cx="872" cy="532" r="5" fill="#C6CFD0"/>
    <rect x="1025" y="432" width="92" height="126" rx="4" fill="url(#kitchen-steel)"/>
    <path d="M1071 432V558" stroke="#7B8688" stroke-width="3"/>
    <rect x="1064" y="467" width="14" height="53" rx="7" fill="#59676B"/>
    <ellipse cx="600" cy="544" rx="78" ry="12" fill="#BAC4C3"/>
    <ellipse cx="600" cy="542" rx="58" ry="8" fill="#8C999A"/>
    <path d="M600 539V493C600 474 620 466 637 475" fill="none" stroke="#69787C" stroke-width="8" stroke-linecap="round"/>
    <path d="M637 475V493" stroke="#69787C" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g id="kitchen-hardware-decor">
    <g stroke="#D8C69C" stroke-width="5" stroke-linecap="round">
      <path d="M125 270H147M238 270H260M351 270H373M850 270H872M963 270H985M1076 270H1098"/>
      <path d="M118 485H140M232 485H254M346 485H368M840 485H862M954 485H976M1068 485H1090"/>
    </g>
    <rect x="97" y="358" width="72" height="26" rx="3" fill="#C9775C"/>
    <rect x="176" y="345" width="28" height="39" rx="3" fill="#587A88"/>
    <path d="M277 384C251 351 262 318 289 332C298 302 332 312 323 346C352 338 363 372 334 386Z" fill="#50755A"/>
    <path d="M294 384V326M294 359L271 343M295 351L317 335" stroke="#355441" stroke-width="4"/>
    <rect x="270" y="378" width="53" height="17" rx="3" fill="#D8C9AF"/>
    <rect x="936" y="357" width="83" height="27" rx="3" fill="#E6DED1"/>
    <rect x="946" y="339" width="73" height="18" rx="3" fill="#C9785D"/>
  </g>

  <g id="kitchen-pendants">
    <path d="M488 0V57M712 0V57" stroke="#344148" stroke-width="5"/>
    <path d="M448 91L474 56H502L528 91Z" fill="#F3E7CF"/>
    <ellipse cx="488" cy="91" rx="42" ry="9" fill="#DDB45E"/>
    <path d="M672 91L698 56H726L752 91Z" fill="#F3E7CF"/>
    <ellipse cx="712" cy="91" rx="42" ry="9" fill="#DDB45E"/>
    <path d="M488 101V140M712 101V140" stroke="#F3D17B" stroke-opacity=".20" stroke-width="66"/>
  </g>
</svg>
